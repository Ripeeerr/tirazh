limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data: blob:; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location = /api/files {
        limit_req zone=uploads burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_request_buffering on;
    }

    location = /api/docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://fastapi.tiangolo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location ~ ^/assets/.*\.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location /pdfjs/ {
        try_files $uri =404;
        expires 1y;
    }

    location /images/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
