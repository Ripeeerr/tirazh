name: Checks
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tirazh
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: tirazh_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U tirazh -d tirazh_test" --health-interval=5s --health-timeout=3s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://tirazh:test-password@localhost:5432/tirazh_test
      TEST_DATABASE_URL: postgresql+psycopg://tirazh:test-password@localhost:5432/tirazh_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check app migrations tests
      - run: uv run ruff format --check app migrations tests
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run format:check
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          python-version: '3.12'
      - run: uv sync --frozen --project ../backend
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
