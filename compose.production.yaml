services:
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: tirazh
      POSTGRES_USER: tirazh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tirazh -d tirazh]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://tirazh:${POSTGRES_PASSWORD}@db:5432/tirazh
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      UPLOAD_DIRECTORY: /app/var/uploads
    command: [uv, run, --no-sync, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment: *api_environment
    command:
      [
        sh,
        -c,
        uv run --no-sync python -m app.seed && exec uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers,
      ]
    volumes:
      - artwork_data:/app/var/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          uv,
          run,
          --no-sync,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  artwork_data:
